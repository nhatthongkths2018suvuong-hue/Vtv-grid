plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vtv.grid'
    compileSdk 34

    defaultConfig {
        applicationId "com.vtv.grid"
        minSdk 21
        targetSdk 33
        versionCode 15
        versionName "1.4.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
